name: Build GKI 6.1

on:
  workflow_dispatch:
    inputs:
      source_method:
        name: Source Sync Method
        description: How to obtain the kernel source
        type: choice
        required: true
        default: repo
        options:
          - repo
          - git

      gki_source:
        name: GKI Source
        description: Select the GKI source
        type: choice
        required: true
        default: default
        options:
          - default
          - custom

      gki_manifest:
        name: Repo Manifest URL
        description: Manifest repository URL when using repo
        type: string
        required: false
        default: ""

      gki_branch:
        name: GKI Branch
        description: Branch to build
        type: string
        required: true
        default: common-android14-6.1

      git_url:
        name: Git Repository URL
        description: Repository to clone when using git
        type: string
        required: false
        default: ""

      git_branch:
        name: Git Branch
        description: Branch to clone when using git
        type: string
        required: false
        default: ""

      ksu:
        name: KernelSU
        description: Select KernelSU integration
        type: choice
        required: true
        default: none
        options:
          - none
          - ksu-next
          - custom

      ksu_url:
        name: Custom KernelSU Setup URL
        type: string
        required: false
        default: ""

      ksu_ref:
        name: KernelSU Ref
        type: string
        required: false
        default: next

        
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'

env:
  DEFAULT_MANIFEST: https://android.googlesource.com/kernel/manifest
  DEFAULT_BRANCH: common-android14-6.1

jobs:
  build-gki:
    name: Build GKI 6.1
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ccache \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libssl-dev \
            bc \
            xsltproc \
            unzip \
            device-tree-compiler \
            python3 \
            python-is-python3 \
            rsync

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl -LSs https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Resolve Build Configuration
        id: config
        shell: bash
        run: |
          set -e

          # Defaults for scheduled builds.
          GKI_SOURCE="${{ inputs.gki_source }}"
          GKI_MANIFEST="${{ inputs.gki_manifest }}"
          GKI_BRANCH="${{ inputs.gki_branch }}"
          KSU="${{ inputs.ksu }}"
          KSU_URL="${{ inputs.ksu_url }}"
          KSU_REF="${{ inputs.ksu_ref }}"

          if [ -z "$GKI_SOURCE" ]; then
            GKI_SOURCE="default"
          fi

          if [ -z "$GKI_MANIFEST" ]; then
            GKI_MANIFEST="${DEFAULT_MANIFEST}"
          fi

          if [ -z "$GKI_BRANCH" ]; then
            GKI_BRANCH="${DEFAULT_BRANCH}"
          fi

          if [ -z "$KSU" ]; then
            KSU="none"
          fi

          if [ -z "$KSU_REF" ]; then
            KSU_REF="next"
          fi

          if [ "$GKI_SOURCE" = "default" ]; then
            GKI_MANIFEST="${DEFAULT_MANIFEST}"
          elif [ "$GKI_SOURCE" = "custom" ]; then
            if [ -z "$GKI_MANIFEST" ]; then
              echo "::error::Custom GKI source selected but no manifest URL was provided."
              exit 1
            fi
          else
            echo "::error::Invalid GKI source: $GKI_SOURCE"
            exit 1
          fi

          if [ "$KSU" = "custom" ] && [ -z "$KSU_URL" ]; then
            echo "::error::Custom KernelSU selected but no setup URL was provided."
            exit 1
          fi

          case "$KSU" in
            none)
              KSU_NAME="No-KSU"
              ;;
            ksu-next)
              KSU_NAME="KernelSU-Next"
              KSU_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_REF}/kernel/setup.sh"
              ;;
            custom)
              KSU_NAME="KernelSU-Custom"
              ;;
            *)
              echo "::error::Invalid KernelSU option: $KSU"
              exit 1
              ;;
          esac

          echo "gki_manifest=$GKI_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "gki_branch=$GKI_BRANCH" >> "$GITHUB_OUTPUT"
          echo "ksu=$KSU" >> "$GITHUB_OUTPUT"
          echo "ksu_url=$KSU_URL" >> "$GITHUB_OUTPUT"
          echo "ksu_name=$KSU_NAME" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Build configuration"
          echo "======================================"
          echo "Manifest : $GKI_MANIFEST"
          echo "Branch   : $GKI_BRANCH"
          echo "KernelSU : $KSU_NAME"
          [ "$KSU" != "none" ] && echo "KSU URL  : $KSU_URL"
          echo "======================================"

      - name: Init and Sync with Repo
        if: inputs.source_method == 'repo' || inputs.source_method == ''
        run: |
          set -e

          mkdir -p workspace
          cd workspace

          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          MANIFEST_URL="${{ steps.config.outputs.gki_manifest }}"
          BRANCH="${{ steps.config.outputs.gki_branch }}"

          echo "Initializing repo:"
          echo "  Manifest: $MANIFEST_URL"
          echo "  Branch:   $BRANCH"

          repo init \
            -u "$MANIFEST_URL" \
            -b "$BRANCH" \
            --depth=1

          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --no-clone-bundle

           - name: Clone Kernel with Git
        if: inputs.source_method == 'git'
        shell: bash
        run: |
          set -e

          REPO_URL="${{ inputs.git_url }}"
          BRANCH="${{ inputs.git_branch }}"

          if [ -z "$REPO_URL" ]; then
            echo "::error::Git source selected but no repository URL was provided."
            exit 1
          fi

          rm -rf workspace

          if [ -n "$BRANCH" ]; then
            git clone \
              --recursive \
              --depth=1 \
              --branch "$BRANCH" \
              "$REPO_URL" \
              workspace
          else
            git clone \
              --recursive \
              --depth=1 \
              "$REPO_URL" \
              workspace
          fi

          cd workspace

          git submodule update --init --recursive

          echo "Kernel source:"
          git remote -v

          echo
          echo "Kernel tree:"
          ls -la

          
      - name: Patch KernelSU
        if: steps.config.outputs.ksu != 'none'
        shell: bash
        run: |
          set -e

          KSU_URL="${{ steps.config.outputs.ksu_url }}"

          if [ -d "workspace/common" ]; then
            # repo-based GKI checkout
            KERNEL_DIR="workspace/common"
          elif [ -f "workspace/Makefile" ] && [ -f "workspace/BUILD.bazel" ]; then
            # direct kernel repository, e.g. engstk/gs
            KERNEL_DIR="workspace"
          else
            echo "::error::Unable to identify kernel source tree."
            exit 1
          fi

          echo "Kernel directory: $KERNEL_DIR"
          echo "KernelSU setup:   $KSU_URL"

          cd "$KERNEL_DIR"

          curl -LSs "$KSU_URL" | bash -

          
      - name: Build GKI Kernel with Bazel
        run: |
          set -e

          cd workspace

          tools/bazel run \
            //common:kernel_aarch64_dist \
            -- \
            --dist_dir=out/dist

      - name: Prepare Artifact Name
        id: artifact
        run: |
          set -e

          KSU_NAME="${{ steps.config.outputs.ksu_name }}"
          BRANCH="${{ steps.config.outputs.gki_branch }}"

          SAFE_BRANCH=$(echo "$BRANCH" | tr '/ ' '--')

          echo "name=GKI-6.1-${SAFE_BRANCH}-${KSU_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            workspace/out/dist/boot.img
            workspace/out/dist/Image
            workspace/out/dist/*.ko
          compression-level: 9
          if-no-files-found: error
